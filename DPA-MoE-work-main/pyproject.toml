[project]
name = "dpa-moe"
version = "0.1.0"
description = "DPA-MoE: runtime precision control for Mixture-of-Experts inference — encoder for prefix-decodable expert weight chunks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "anybcq",
    "datasets>=4.8.4",
    # Writes the GGUF artifact consumed by the llama.cpp fork
    # (third_party/llama.cpp), including the dpa_moe.* metadata keys.
    "gguf>=0.10.0",
    "huggingface_hub>=1.9.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pyyaml>=6.0",
    "safetensors>=0.7.0",
    "tenacity>=9.1.4",
    "torch>=2.11.0",
    "transformers>=5.6.0.dev0",
]

[project.scripts]
dpa-moe-encode = "dpa_moe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dpa_moe"]

[tool.uv.sources]
# naver-aics/anybcq @ c316a4d, vendored under third_party/anybcq/. The
# upstream package ships anybcq/utils/ and anybcq/inference/ without
# __init__.py, so it is installed from the vendored copy that adds them
# (see third_party/anybcq/NOTICE.md).
anybcq = { path = "third_party/anybcq", editable = true }
transformers = { git = "https://github.com/huggingface/transformers.git", rev = "d42f8ba5c86ee7d1472dd18ed929b4dbc3cd1f35" }

[dependency-groups]
dev = [
    "cmake>=4.3.1",
    "pytest>=9.0.3",
    "ruff>=0.6",
    "sentencepiece>=0.2.1",
]

# anybcq's setup.py pins transformers==4.51.0, lm_eval==0.4.5 and
# peft==0.10.0, which conflict with the transformers revision above.
[tool.uv]
override-dependencies = [
    "transformers",
    "lm_eval",
    "peft>=0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["third_party", "experiments/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "E741"]
