# Qwen3-30B-A3B DPA-MoE experiment config.
#
# Schema: shared model/hardware metadata plus two preparation sections:
#   encode    - AnyBCQ codebook calibration and GGUF materialization
#   profile   - dynamic precision profile generation
#
# Benchmark settings live under experiments/config/Qwen3-30B-A3B/.

code_sha: 3b77fa7
seed: 0

model:
  key: qwen3_moe
  family: Qwen3-30B-A3B
  adapter: qwen3_moe
  n_layers: 48
  hf:
    repo: Qwen/Qwen3-30B-A3B
    revision: ad44e777
    local_dir: cache/models/Qwen3-30B-A3B/hf
    size_gb: 57
  bf16_gguf: cache/models/Qwen3-30B-A3B/baseline/Qwen3-30B-A3B-BF16-00001-of-00002.gguf
  baseline_gguf:
    repo: unsloth/Qwen3-30B-A3B-GGUF
    revision: d5b1d57b
    local_dir: cache/models/Qwen3-30B-A3B/baseline
    quants: [Q2_K, Q5_K_M, Q8_0]
  codebooks:
    ss_anybcq: cache/models/Qwen3-30B-A3B/ss_anybcq_layer
    anybcq: cache/models/Qwen3-30B-A3B/anybcq_layer
  ggufs:
    ss_anybcq: cache/models/Qwen3-30B-A3B/chunked/ss_anybcq.gguf
    anybcq: cache/models/Qwen3-30B-A3B/chunked/anybcq.gguf

hardware:
  gpu_pin: 6
  gpu_model: NVIDIA RTX PRO 6000 Blackwell Server Edition
  gpu_vram_gib: 96
  ram_gib: 1228

encode:
  variant: ss_anybcq
  gpus: [1]
  inner_bs: 2
  fp_caching: true
  calibration:
    files:
      - cache/datasets/calibration_v3.txt
      - cache/datasets/calibration_v5.txt
      - cache/datasets/wikitext-2-raw-train.txt
    sha256:
      - 200e109bcd2b599fabcceaada7f52bbd1e7c8f9ae030b8dc59c011de039a8026
      - 2a0118c633250aad448cfc2d103e10a731af6974dab1738ca19261fce3587b80
      - c58d555a94ada0882d1e8c0b3dc7ba68e1c269da5ad9e7a057300245d130c4e8
  hyperparams:
    base_precision: 2
    target_precision: 8
    group_size: 128
    iters: 20
    num_samples: 512
    batch_size: 2
    seq_len: 2048
    w_lr1: 1.0e-4
    w_lr2: 1.0e-4
    w_lr3: 1.0e-4
    asymmetric: true
    train_beta: true        # anybcq variant only; ss_anybcq keeps beta fixed after its least-squares init
    any_precision_alpha: false
    recon_dtype: float32

profile:
  encoding: ss_anybcq
  gpu: [1]
  seed: 0
  residuals_npz: cache/experiment/ss_anybcq/layout_solver/expert_residuals.npz
  runtime_bin: cache/experiment/Qwen3-30B-A3B/3_dynamic_precision/bin/expert_residuals.bin
  corpus:
    - cache/datasets/wikitext-2-raw-train.txt
  max_tokens: 16384
  max_per_expert: 256
  seq_len: 2048
