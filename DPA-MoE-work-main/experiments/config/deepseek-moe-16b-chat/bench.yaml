# DeepSeek downstream benchmark config.
# Baseline, uniform, and dynamic configs share one config; per-series
# n_parallel controls request concurrency. Scheduled configs are case-study only.
model:
  key: deepseek_moe
  family: deepseek-moe-16b-chat
benchmark:
  gpu: [0, 1]
  fast_mode: true
  config:
    baseline: [Q2_K, Q5_K_M, Q8_0]
    uniform_k: [2, 3, 4, 5, 6, 7, 8]
    dynamic_k: [2.5, 3, 4, 5, 6, 6.5, 7]
  dynamic_profile_file: cache/experiment/deepseek-moe-16b-chat/3_dynamic_precision/bin/expert_residuals.bin
  max_tokens: 8192
  vram_cap_mb: 30000
  full_pin_vram_cap_mb: 30000
  allow_capture: true
  pin_all: true
  seed: 0
  temperature: 0.0
  reasoning_budget: 0
  llama_perplexity:
    ctx_size: 4096
    batch_size: 2048
    ubatch_size: 512
    serial_np1: true
    n_parallel:
      baseline: 1
      uniform: 1
      dynamic: 1
  benchmarks:
    llama-perplexity: [arc_c, arc_e, piqa, winogrande]
