[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ocdpa"
version = "0.1.0"
description = "On-chip dynamic precision allocation for ADC-shared analog in-memory MoE accelerators"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "torch", "transformers", "datasets", "safetensors", "matplotlib"]

[tool.setuptools.packages.find]
include = ["ocdpa*"]
