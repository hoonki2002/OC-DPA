# Qwen3 full-cap runtime TPS validation for K=3/4/5/6/7.
# Launch one mode per GPU with MODES=<name> and GPU=<physical id>.
model:
  key: qwen3_moe
  family: Qwen3-30B-A3B
benchmark:
  gpu: [0, 1, 2, 3, 4, 5, 6, 7]
  config:
    baseline: []
    uniform_k: [3, 4, 5, 6, 7]
    dynamic_k: [3, 4, 5, 6, 7]
  gpu_map:
    uniform_k3: 0
    uniform_k4: 1
    uniform_k5: 2
    uniform_k6: 3
    uniform_k7: 4
    dynamic_k3: 5
    dynamic_k4: 6
    dynamic_k5: 7
    dynamic_k6: 0
    dynamic_k7: 1
  dynamic_profile_file: cache/experiment/Qwen3-30B-A3B/3_dynamic_precision/bin/expert_residuals_wikitext_monotonic.bin
  seed: 0
  speed_sweep:
    warmup_runs: 6
    measured_runs: 1
    vram_cap_mbs: [40000]
    ctx_size: 4096
    generate_tokens: 256
    batch_size: 2048
    ubatch_sizes: [256]
    allow_capture: false
    pin_all: true
    host_cache: 0
    host_cap_mb: 0
    no_cache_prompt: true
    ignore_eos: true
    sample_seed: 0
    kernel:
      optimized: true
      optimized_batch: true
      optimized_span: 3
      fused_mixed_mode: optimized
      fused_plane_group: 2
    scheduler:
      dynamic_gpu_planner: true
      compare_gpu_cpu_planner: false
      profile_planner: false
    lengths:
      - {name: p1024_g256, prompt_tokens: 1024, generate_tokens: 256}
    datasets:
      - {name: wikitext, path: cache/datasets/wikitext-2-raw-test.txt, n_samples: 100}
      - {name: c4_en, path: cache/datasets/c4_en_validation.txt, n_samples: 100}
      - {name: c4_ko, path: cache/datasets/c4_ko_validation.txt, n_samples: 100}
